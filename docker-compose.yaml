version: '3s'
services:
  web:
    build: .
    ports:
      - "8000:8080"
    depends_on:
      - db
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/biller

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biller
    ports:
      - "5432:5432"
    